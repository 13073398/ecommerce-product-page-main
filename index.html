<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Akaya+Kanadaka&family=Cairo:wght@200..1000&family=Kumbh+Sans:wght,YOPQ@100..900,300&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Tajawal:wght@200;300;400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="normalize.css">
   <link rel="stylesheet" href="all.min.css">
  <link rel="stylesheet" href="all.css">
  <title>Frontend Mentor | E-commerce product page</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <!-- Start navbar -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary main_menue">
        <div class="container">
          <div class="container-fluid  main_menue_container">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="icon"><a class="navbar-brand" href="#">sneakers</a></div>
            <div class="collapse navbar-collapse main_menue_details" id="navbarNav">
                <ul class="navbar-nav">
                  <li class="nav-item">
                    <a class="nav-link " aria-current="page" href="#">Collection</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="#">Men</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="#">Women</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="#">About</a>
                  </li>
                
                </ul>
            </div>
            <div class="image">
              <img src="./images/icon-cart.svg" alt="image">
              <img src="./images/image-avatar.png" alt="image">
            </div>

          </div>
        </div>
        
</nav>
  <!-- End navbar -->
   <!-- Start hero sectiom -->

<div class="hero_section">
  <div class="container">
    <div class="right">
            <header>
              <p>SNEAKER COMPANY</p>
              <h1>Fall Limited Edition Sneakers</h1>
          </header>

          <p>
              These low-profile sneakers are your perfect casual wear companion. 
              Featuring a durable rubber outer sole, they'll withstand everything 
              the weather can offer.
          </p>

          <!-- Pricing Information -->
          <div>
              <div>
                  <strong>$125.00</strong>
                  <span>50%</span>
              </div>
              <del>$250.00</del>
          </div>

          <!-- Product Actions -->
          <div>
              <!-- Quantity Picker -->
              <div>
                  <button type="button" aria-label="Decrease quantity">-</button>
                  <span>0</span>
                  <button type="button" aria-label="Increase quantity">+</button>
              </div>

              <!-- Add to Cart Button -->
              <button type="button">
                  <!-- Shopping Cart Icon placeholder -->
                  <svg width="22" height="20" xmlns="http://www.w3.org/2000/svg">
                      <path d="M20.925 3.641H3.862L3.61 2.2C3.528 1.737 3.123 1.4 2.652 1.4H.825C.369 1.4 0 1.769 0 2.225c0 .456.369.825.825.825h1.118l2.1 12.015c.106.606.634 1.05 1.25 1.05h12.518c.616 0 1.144-.444 1.25-1.05l1.64-9.375c.08-.456-.271-.849-.726-.849zM6.125 18a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm10 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z" fill="#FFF"/>
                  </svg>
                  Add to cart
              </button>
          </div>
      </div>
      <div class="left">
        <!-- Top Section: Big Image -->
        <div class="top_section">
            <img src="./images/image-product-1.jpg" alt="image">
        </div>

        <!-- Bottom Section: 4 Thumbnail Images -->
        <div class="bottom_section">
           <img src="./images/image-product-3-thumbnail.jpg" alt="Sneakers thumbnail 4">
            <img src="./images/image-product-3-thumbnail.jpg" alt="Sneakers thumbnail 4">
             <img src="./images/image-product-3-thumbnail.jpg" alt="Sneakers thumbnail 4">
            <img src="./images/image-product-3-thumbnail.jpg" alt="Sneakers thumbnail 4">
            
        </div>
    </div>
  </div>
      
</div>

</body>
</html>
</html>
</html>
